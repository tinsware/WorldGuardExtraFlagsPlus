name: WorldGuardExtraFlagsPlus
description: |
  WorldGuard ExtraFlags Plus (WGEFP) — 44+ extra region flags for WorldGuard: item & throwable blocking, entry control (XP / permission / player count), chat formatting, and region command automation. Folia supported.
  GitHub: https://github.com/tinsware/WorldGuardExtraFlagsPlus
main: dev.tins.worldguardextraflagsplus.WorldGuardExtraFlagsPlusPlugin
version: 4.4.6
api-version: '1.21'
folia-supported: true
depend: [ WorldGuard ]
softdepend: [ ProtocolLib, packetevents, PlaceholderAPI, Essentials, EssentialsX, TAB ]

authors: [tins, isokissa3]

commands:
  wgefp:
    description: Main command for WorldGuardExtraFlagsPlus
    aliases: [wgefplus, worldguardextraflagsplus]
    permission: worldguardextraflagsplus.reload
    usage: |
      /<command> reload - Reload messages from messages-wgefp.yml

permissions:
  worldguardextraflagsplus.worldedit.bypass:
    description: Bypass WorldGuard worldedit DENY regions for WorldEdit / FAWE operations
    default: false
  worldguardextraflagsplus.worldedit.silent-deny:
    description: Do not show chat when WorldEdit is blocked by the worldedit flag
    default: false

