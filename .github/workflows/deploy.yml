name: Build And Deploy

on:
  push:
    branches: [ master ]
  # Re-enable when publishing GitHub Releases with jar assets:
  # release:
  #   types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Paper API 26.1.x / WorldGuard 7.0.18+ dependency jars require JDK 25+ to compile (class file 69).
    # Maven still targets Java 21 bytecode via <release>21</release> in the root pom.
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: WorldGuardExtraFlagsPlus Jar
      uses: actions/upload-artifact@v4
      with:
        name: WorldGuardExtraFlagsPlus Jar
        path: "${{ github.workspace }}/Spigot/target/worldguard-extraflagsplus-*.jar"

  # Disabled until maintainers publish releases again — avoids duplicate builds on release: created.
